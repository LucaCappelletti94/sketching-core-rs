# Tag-driven publish to crates.io via OIDC trusted publishing.
#
# Setup (one-time):
#   1. Publish v0.1.0 manually from a developer machine.
#   2. On crates.io, open the sketching-core crate settings, go to "Trusted
#      Publishers", and add a GitHub Actions publisher: repository owner
#      `LucaCappelletti94`, repository name `sketching-core-rs`, workflow
#      filename `release.yml`, environment empty.
#
# Subsequent releases:
#   - Bump `version` in Cargo.toml, merge through CI on `main`.
#   - `git tag v0.2.0 && git push origin v0.2.0`.
#   - This workflow picks up the tag, re-runs the quality gate against the
#     tagged commit, verifies the tag matches the manifest version, authenticates
#     to crates.io via OIDC, runs `cargo publish`, and drafts a GitHub release
#     with autogenerated notes.
#
# The `workflow_dispatch` trigger is for shaking the pipeline without going to
# crates.io: enable `dry_run` and the publish step runs `cargo publish --dry-run`
# instead.

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run cargo publish --dry-run only (no crates.io upload)"
        type: boolean
        default: true

# `id-token: write` is required by the OIDC token exchange with crates.io.
# `contents: write` is only used by the GitHub release step (tag-push branch).
permissions:
  id-token: write
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

# A half-finished publish should not be cancelled by a later run; let it complete or fail loudly.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: verify tag matches Cargo.toml version
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          TAG_VERSION="${TAG#v}"
          MANIFEST_VERSION="$(grep -m1 -E '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "tag version '$TAG_VERSION' does not match Cargo.toml version '$MANIFEST_VERSION'" >&2
            exit 1
          fi

      - name: quality gate
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo clippy --no-default-features -- -D warnings
          cargo test --all-features
          cargo test --no-default-features
          cargo test --doc --all-features
          cargo build --no-default-features
          cargo doc --no-deps --all-features

      - name: crates.io trusted-publisher OIDC exchange
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: cargo publish (dry-run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --dry-run

      - name: cargo publish
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish

      - name: draft GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: true
